<dialog class="session-board-dialog" id="session-board-dialog" aria-labelledby="session-dialog-title" aria-describedby="session-dialog-copy">
  <form id="session-board-dialog-form">
    <h2 id="session-dialog-title"></h2>
    <p id="session-dialog-copy"></p>
    <label data-board-destination hidden>Destino <select></select></label>
    <label data-board-reason hidden>Motivo do impedimento <textarea rows="3" maxlength="300"></textarea></label>
    <p class="session-dialog-error" data-board-error role="alert" hidden></p>
    <div class="session-dialog-actions">
      <button class="button button-secondary" type="button" data-board-cancel>Cancelar</button>
      <button class="button button-primary" type="submit" data-board-confirm></button>
    </div>
  </form>
</dialog>
