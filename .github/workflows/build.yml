name: Build exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean --windowed --name TestAiZe --add-data "testplayer/templates;testplayer/templates" --add-data "testplayer/static;testplayer/static" launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: TestAiZe-windows
          path: dist/TestAiZe
