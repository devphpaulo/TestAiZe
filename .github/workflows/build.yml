name: Build exe

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Preparar ambiente de testes de automação
        shell: pwsh
        run: |
          npm install --global @playwright/test@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:TESTAIZE_PYTHON = "python"
          npm --prefix src/playwright-recorder test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/playwright-recorder run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix src/playwright-recorder run test:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Gerar executável versionado
        id: pkg
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/src"
          $version = python -c "from testplayer.version import PACKAGE_VERSION; print(PACKAGE_VERSION)"
          "version=$version" >> $env:GITHUB_OUTPUT
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name "TestAiZe-$version" --icon assets/testaize.ico --paths src --add-data "src/testplayer/templates;testplayer/templates" --add-data "src/testplayer/static;testplayer/static" --add-data "src/playwright-recorder;playwright-recorder" --hidden-import pystray._win32 src/launcher.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar executável com ferramentas do ambiente
        shell: pwsh
        run: |
          $env:TESTAIZE_EXE = "$PWD/dist/TestAiZe-${{ steps.pkg.outputs.version }}.exe"
          $env:TESTAIZE_PYTHON = "python"
          npm --prefix src/playwright-recorder run test:host
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: TestAiZe-windows-${{ steps.pkg.outputs.version }}
          path: dist/TestAiZe-*.exe
