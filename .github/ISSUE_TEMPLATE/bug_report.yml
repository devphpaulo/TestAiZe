name: Reportar bug
description: Algo não está funcionando como deveria
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: O que aconteceu?
      description: Descreva o comportamento observado.
    validations:
      required: true
  - type: textarea
    attributes:
      label: O que você esperava?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Passos para reproduzir
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    attributes:
      label: Versão
      description: Versão exibida no nome do executável ou commit, se rodou do código-fonte.
  - type: textarea
    attributes:
      label: Evidências
      description: Prints e/ou trechos do log (Documentos/TestAiZe/logs). Não cole dados sensíveis.
